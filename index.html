<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Coordination Dashboard</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .agent-card {
            border: 2px solid #00ff00;
            padding: 15px;
            background: #0f0f0f;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        .agent-card.active {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); }
        }
        .messages {
            border: 2px solid #00ff00;
            padding: 15px;
            margin: 20px 0;
            background: #0f0f0f;
            max-height: 300px;
            overflow-y: auto;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
            border-left: 3px solid #00ff00;
            background: rgba(0, 255, 0, 0.05);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
            padding: 15px;
            border: 2px solid #00ff00;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        .observations {
            border: 2px solid #00ff00;
            padding: 15px;
            background: #0f0f0f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Multi-Agent Coordination Experiment 🤖</h1>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="agent-count">0</div>
                <div>Active Agents</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="message-count">0</div>
                <div>Messages Sent</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="pattern-count">0</div>
                <div>Patterns Detected</div>
            </div>
        </div>

        <h2>Active Agents</h2>
        <div class="agents-grid" id="agents-container">
            <!-- Agent cards will be dynamically inserted -->
        </div>

        <h2>Communication Log</h2>
        <div class="messages" id="messages-container">
            <!-- Messages will be dynamically inserted -->
        </div>

        <h2>Observations & Patterns</h2>
        <div class="observations" id="observations-container">
            <!-- Observations will be dynamically inserted -->
        </div>
    </div>

    <script>
        async function loadState() {
            try {
                const response = await fetch('state/shared.json');
                const data = await response.json();

                // Update stats
                const agentCount = Object.keys(data.agents || {}).length;
                document.getElementById('agent-count').textContent = agentCount;
                document.getElementById('message-count').textContent = (data.messages || []).length;
                document.getElementById('pattern-count').textContent = (data.memory?.patterns_observed || []).length;

                // Render agents
                const agentsContainer = document.getElementById('agents-container');
                agentsContainer.innerHTML = '';
                for (const [id, agent] of Object.entries(data.agents || {})) {
                    const card = document.createElement('div');
                    card.className = `agent-card ${agent.status === 'active' ? 'active' : ''}`;
                    card.innerHTML = `
                        <h3>${agent.name || agent.id}</h3>
                        <p><strong>Role:</strong> ${agent.role || 'Unknown'}</p>
                        <p><strong>Branch:</strong> ${agent.branch ? agent.branch.substring(0, 40) + '...' : 'N/A'}</p>
                        <p><strong>Status:</strong> ${agent.status}</p>
                        ${agent.capabilities ? `<p><strong>Capabilities:</strong> ${agent.capabilities.join(', ')}</p>` : ''}
                    `;
                    agentsContainer.appendChild(card);
                }

                // Render messages
                const messagesContainer = document.getElementById('messages-container');
                messagesContainer.innerHTML = '';
                (data.messages || []).reverse().forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';
                    msgDiv.innerHTML = `
                        <strong>${msg.from}</strong> - ${msg.timestamp}<br>
                        ${msg.text || msg.message}
                    `;
                    messagesContainer.appendChild(msgDiv);
                });

                // Render observations
                const observationsContainer = document.getElementById('observations-container');
                observationsContainer.innerHTML = '';
                (data.memory?.patterns_observed || []).forEach(obs => {
                    const obsDiv = document.createElement('div');
                    obsDiv.textContent = '• ' + obs;
                    observationsContainer.appendChild(obsDiv);
                });

            } catch (error) {
                console.error('Error loading state:', error);
            }
        }

        // Load state immediately and refresh every 5 seconds
        loadState();
        setInterval(loadState, 5000);
    </script>
</body>
</html>
